version: "3.9"

services:
  backend:
    build: ./backend
    image: intellideploy-backend:${BUILD_TAG:-latest}
    container_name: intellideploy-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    image: intellideploy-frontend:${BUILD_TAG:-latest}
    container_name: intellideploy-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
